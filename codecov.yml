# Coverage of legacy/LightPcapNg by the conformance suite, uploaded by the coverage job in .github/workflows/build.yml
coverage:
  status:
    project:
      default:
        # Coverage must not drop below the base commit's
        target: auto
        threshold: 0%
    # PRs add tests, not legacy code, so per-diff coverage has nothing to measure
    patch: off

codecov:
  notify:
    # Both coverage jobs (with and without zstd) upload; report once both have arrived
    after_n_builds: 2
    wait_for_ci: yes

# The conformance tool and its vendored code are test infrastructure, not code under test. The three legacy files
# have no code the 11 ext functions can reach (conformance/coverage/gcovr.cfg also leaves out the unreachable
# functions in the other files, before upload).
ignore:
  - "conformance/**"
  - "legacy/LightPcapNg/src/light_advanced.c"
  - "legacy/LightPcapNg/src/light_io.c"
  - "legacy/LightPcapNg/src/light_pcapng_cont.c"
